<!-- Settings View -->
<div id="view-settings" class="view-panel hidden">
    <div class="view-header">
        <div>
            <h1 class="view-title">Settings</h1>
            <p class="view-subtitle">Saved automatically to <code>app_settings.json</code>.</p>
        </div>
    </div>

    <div class="settings-stack">
        <!-- Library Path -->
        <div class="settings-section">
            <h3 class="settings-card-title"><i class="fa-solid fa-folder-open" style="color: var(--accent); margin-right: 8px;"></i>Library Path</h3>
            <p class="settings-card-desc">
                Root folder where your SQLite database (<code>data/library.db</code>), songs, artist avatars, and album artwork are stored.
            </p>
            <div class="path-picker-row">
                <input type="text" class="form-input" id="settings-library-path" placeholder="No library selected">
                <button type="button" class="btn btn-secondary" id="btn-settings-browse-library">
                    <i class="fa-solid fa-folder"></i> Browse
                </button>
                <button type="button" class="btn btn-primary" id="btn-settings-apply-library">
                    Save Path
                </button>
            </div>
            <span id="settings-library-status" style="font-size: 12px; color: var(--accent);"></span>
        </div>

        <!-- Theme Picker -->
        <div class="settings-section">
            <h3 class="settings-card-title"><i class="fa-solid fa-palette" style="color: var(--accent); margin-right: 8px;"></i>Theme</h3>
            <p class="settings-card-desc">Pick an atmosphere for your workspace. Themes apply instantaneously and persist across sessions.</p>
            <div class="theme-grid" id="settings-theme-grid">
                <button type="button" class="theme-card" data-theme-id="emerald-dark">
                    <div class="theme-swatch">
                        <span style="background:#090c12;"></span>
                        <span style="background:#141b28;"></span>
                        <span style="background:#10b981;"></span>
                    </div>
                    <span class="theme-name">Obsidian Emerald</span>
                </button>
                <button type="button" class="theme-card" data-theme-id="midnight-violet">
                    <div class="theme-swatch">
                        <span style="background:#0b0816;"></span>
                        <span style="background:#1c1534;"></span>
                        <span style="background:#a855f7;"></span>
                    </div>
                    <span class="theme-name">Midnight Amethyst</span>
                </button>
                <button type="button" class="theme-card" data-theme-id="ocean-cyan">
                    <div class="theme-swatch">
                        <span style="background:#061019;"></span>
                        <span style="background:#0f2234;"></span>
                        <span style="background:#06b6d4;"></span>
                    </div>
                    <span class="theme-name">Nordic Frost</span>
                </button>
                <button type="button" class="theme-card" data-theme-id="amber-studio">
                    <div class="theme-swatch">
                        <span style="background:#120e0b;"></span>
                        <span style="background:#261e18;"></span>
                        <span style="background:#f59e0b;"></span>
                    </div>
                    <span class="theme-name">Warm Vinyl</span>
                </button>
                <button type="button" class="theme-card" data-theme-id="crimson-noir">
                    <div class="theme-swatch">
                        <span style="background:#0b090b;"></span>
                        <span style="background:#20141c;"></span>
                        <span style="background:#f43f5e;"></span>
                    </div>
                    <span class="theme-name">Crimson Night</span>
                </button>
                <button type="button" class="theme-card" data-theme-id="apple-music">
                    <div class="theme-swatch">
                        <span style="background:#ffffff;"></span>
                        <span style="background:#f5f5f7;"></span>
                        <span style="background:#fa2d48;"></span>
                    </div>
                    <span class="theme-name">Apple Music</span>
                </button>
            </div>
        </div>
    </div>
</div>
