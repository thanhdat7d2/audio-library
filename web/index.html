<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Library Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo-container">
                <i class="fa-solid fa-compact-disc logo-icon"></i>
                <span class="logo-text">DECK MANAGER</span>
            </div>

            <nav style="flex: 1;">
                <ul class="nav-menu">
                    <li class="nav-item active" data-view="dashboard">
                        <i class="fa-solid fa-chart-simple"></i>
                        <span>Dashboard</span>
                    </li>
                    <li class="nav-item" data-view="songs">
                        <i class="fa-solid fa-music"></i>
                        <span>Songs</span>
                    </li>
                    <li class="nav-item" data-view="artists">
                        <i class="fa-solid fa-microphone-lines"></i>
                        <span>Artists</span>
                    </li>
                    <li class="nav-item" data-view="albums">
                        <i class="fa-solid fa-record-vinyl"></i>
                        <span>Albums</span>
                    </li>
                    <li class="nav-item" data-view="projects">
                        <i class="fa-solid fa-sliders"></i>
                        <span>Projects</span>
                    </li>
                    <li class="nav-item" data-view="import">
                        <i class="fa-solid fa-file-import"></i>
                        <span>Add / Import</span>
                    </li>
                </ul>
            </nav>

            <div class="nav-menu">
                <div class="nav-item" id="btn-change-library">
                    <i class="fa-solid fa-folder-open"></i>
                    <span>Switch Library</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- include:partials/views_catalog.html -->
            <!-- include:partials/views_import.html -->
        </main>
    </div>

    <!-- Persistent Player Bar (Footer) -->
    <footer class="player-bar">
        <div class="player-track-info">
            <img src="" class="player-cover hidden" id="current-cover">
            <div style="width: 48px; height: 48px; border-radius: 6px; background-color: rgba(255,255,255,0.05); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center;" id="player-placeholder-cover">
                <i class="fa-solid fa-music" style="color: var(--text-muted);"></i>
            </div>
            <div class="player-metadata">
                <span class="player-track-name" id="current-title">Select a song to play</span>
                <span class="player-track-artist" id="current-artist">-</span>
            </div>
        </div>

        <div class="player-controls">
            <div class="player-buttons">
                <button class="player-btn" id="btn-prev"><i class="fa-solid fa-backward-step"></i></button>
                <button class="player-btn player-btn-main" id="btn-play-pause"><i class="fa-solid fa-circle-play"></i></button>
                <button class="player-btn" id="btn-next"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="player-slider-container">
                <span class="player-time" id="player-current-time">0:00</span>
                <div class="player-progress" id="player-progress-bar">
                    <div class="player-progress-fill" id="player-progress-fill"></div>
                </div>
                <span class="player-time" id="player-total-time">0:00</span>
            </div>
        </div>

        <div class="player-volume-container">
            <i class="fa-solid fa-volume-high" style="color: var(--text-secondary); font-size: 14px;"></i>
            <div class="player-volume-bar" id="player-volume-bar">
                <div class="player-volume-fill" id="player-volume-fill"></div>
            </div>
        </div>
    </footer>

    <audio id="main-audio-element" style="display: none;"></audio>

    <!-- include:partials/modals.html -->

    <!-- Modular App JavaScript -->
    <script src="/js/state.js"></script>
    <script src="/js/player.js"></script>
    <script src="/js/views.js"></script>
    <script src="/js/modals.js"></script>
    <script src="/js/spreadsheet.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
